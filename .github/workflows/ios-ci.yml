# Builds Handheld Haven for the iOS Simulator and runs unit tests, UI tests,
# and accessibility audits. No signing and no upload.
name: iOS build and test

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Intel runners are a separate free pool from the arm64 macOS images, which
    # often sit in the queue until GitHub gives up on acquiring a machine.
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check bundled JSON matches the source text
        run: |
          python3 tools/build_content.py
          git diff --exit-code -- HandheldHaven/Resources/haven-data.json

      - name: Use the newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify
          fi
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and run tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project HandheldHaven.xcodeproj \
            -scheme HandheldHaven \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/HandheldHaven.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Test summary
        if: always()
        run: |
          if [ -d build/HandheldHaven.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/HandheldHaven.xcresult --compact | tee build/test-summary.json || true
            xcrun xcresulttool get test-results tests --path build/HandheldHaven.xcresult --compact > build/test-list.json || true
          fi
          grep -h "Accessibility audit" build/xcodebuild.log > build/accessibility-audit.txt || true
          cat build/accessibility-audit.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HandheldHaven-test-results
          path: |
            build/HandheldHaven.xcresult
            build/xcodebuild.log
            build/test-summary.json
            build/test-list.json
            build/accessibility-audit.txt
          if-no-files-found: warn
