# XcodeGen spec for Handheld Haven. CI runs `xcodegen generate`.
# Locally: brew install xcodegen && xcodegen generate
name: HandheldHaven
options:
  bundleIdPrefix: com.thompsonoffice
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  HandheldHaven:
    type: application
    platform: iOS
    sources:
      - path: HandheldHaven
    settings:
      base:
        PRODUCT_NAME: HandheldHaven
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.handheldhaven
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Handheld Haven
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ENABLE_TESTABILITY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  HandheldHavenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HandheldHavenTests
    dependencies:
      - target: HandheldHaven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.handheldhaven.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HandheldHaven.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HandheldHaven"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HandheldHavenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HandheldHavenUITests
    dependencies:
      - target: HandheldHaven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.handheldhaven.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HandheldHaven
schemes:
  HandheldHaven:
    build:
      targets:
        HandheldHaven: all
        HandheldHavenTests: [test]
        HandheldHavenUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HandheldHavenTests
        - HandheldHavenUITests
    archive:
      config: Release
